<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSI Smart Transformer</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/css/app.css" rel="stylesheet"></head>
<body class="login-bg">
<div class="login-card">
  <div class="brand-mark">✦</div>
  <h2 class="fw-bold mb-2">Smart Data Transformation</h2>
  <p class="text-secondary mb-4">Prepare, map, validate and standardize shipment data with AI — CSI LLM online, Smart Analyzer offline.</p>
  <form method="post" action="/api/login">
    <label class="form-label">Username</label><input name="username" class="form-control mb-3" value="admin" required>
    <label class="form-label">Password</label><input name="password" type="password" class="form-control mb-4" required>
    <button class="btn btn-primary w-100 py-2">Sign in</button>
  </form>
  <div class="small text-secondary mt-4">Credentials are controlled through <code>.env</code>.</div>
</div>
</body></html>
